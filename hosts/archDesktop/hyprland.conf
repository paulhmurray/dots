# archDesktop — Ryzen 7 5700X, RTX 3060, three displays.
#
# NVIDIA driver, env vars and early KMS are NOT here: scripts/hardware.sh
# detects the GPU and writes dotfiles/hypr/hardware.conf. Keep this file to
# what is genuinely specific to this machine's desk.
#
# Carried from Omarchy's ~/.config/hypr/monitors.conf, 17 Sep 2026.
# Only DP-1 was attached when this was captured; the other two were verified
# by Paul as present but unplugged. Hyprland ignores rules for absent outputs,
# so leaving all three listed is safe.

monitor = DP-1,     3440x1440@99, 0x0,     1                  # Samsung C34H89x ultrawide
monitor = DP-2,     1920x1080@60, -1080x0, 1, transform, 3    # left, rotated 270
monitor = HDMI-A-1, 1920x1080@60, 3440x0,  1, transform, 1    # right, rotated 90

# Anything else that appears gets a sane default rather than stacking at 0x0.
monitor = , preferred, auto, 1

workspace = 1, monitor:DP-2,     default:true
workspace = 2, monitor:DP-1,     default:true
workspace = 3, monitor:HDMI-A-1, default:true

# Carried verbatim from the Omarchy config. Worth a second look: a global
# GDK_SCALE of 2 on a 3440x1440 panel makes GTK apps very large. If GTK apps
# look oversized on the ultrawide after migration, this line is why.
env = GDK_SCALE,2
