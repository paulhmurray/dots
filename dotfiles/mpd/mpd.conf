# MPD: the music engine under the Cadence front-end. Runs as a user service
# (mpd.service from the package), so it plays with no window open and needs
# no sudo. mpd-mpris sits beside it so media keys and the bar see it.

music_directory    "~/Music"
playlist_directory "~/.local/share/mpd/playlists"
db_file            "~/.local/share/mpd/database"
state_file         "~/.local/share/mpd/state"
sticker_file       "~/.local/share/mpd/sticker.sql"

# Unix socket for the front-end, localhost TCP for mpd-mpris and mpc.
# Never on the network.
bind_to_address    "$XDG_RUNTIME_DIR/mpd.socket"
bind_to_address    "127.0.0.1"
port               "6600"

# Pick up music added to ~/Music without a manual rescan.
auto_update        "yes"
restore_paused     "yes"

audio_output {
    type "pipewire"
    name "PipeWire"
}

# Tags can be patchy; ReplayGain where present, otherwise untouched.
replaygain         "auto"
