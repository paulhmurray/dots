set -g status-style "bg=#1d2021,fg=#ebdbb2"
set -g status-left-length 30
set -g status-left "#[bg=#fe8019,fg=#282828,bold]  #S #[bg=#1d2021,fg=#fe8019]#[default] "
set -g status-right "#[fg=#83a598] #(cat /etc/hostname)  #[fg=#b8bb26]󰥔 %H:%M #[fg=#fabd2f]󰃭 %a %d %b "
set -g window-status-format "#[fg=#928374] #I #W "
set -g window-status-current-format "#[bg=#3c3836,fg=#fe8019,bold] #I #W #[default]"
set -g window-status-separator ""
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#fe8019"
set -g message-style "bg=#3c3836,fg=#ebdbb2"
