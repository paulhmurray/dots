unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",foot:RGB"

# splits open in the current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# vim-style pane movement
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ...and the same keys shifted to resize, because the stock bindings are
# prefix + M-<arrow> and the arrow keys are a reach on this keyboard.
# -r so they repeat: after the first one, keep tapping H/J/K/L without
# pressing the prefix again, within repeat-time (500ms).
#
# L replaces tmux's default switch-client -l, which switches to the last
# *client* rather than the last session. With one terminal attached there is
# never another client to switch to, so nothing is lost.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# vim keys in copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

source-file ~/.config/tmux/colours.conf
set -g status-position top
