source = ~/.config/hypr/colours.conf
source = ~/.config/hypr/host.conf
source = ~/.config/hypr/hardware.conf


$mod = SUPER
$term = foot

exec-once = /usr/lib/polkit-kde-authentication-agent-1

input {
    kb_layout = us
    kb_options = ctrl:nocaps
    touchpad {
        natural_scroll = true
    }
}

general {
	gaps_in = 5
	gaps_out = 10
	border_size = 2
	layout = dwindle
    col.active_border = $accent
    col.inactive_border = $dim
}

decoration {
	rounding = 6
}
exec-once = quickshell
bind = $mod, R, exec, pkill quickshell; quickshell &
bind = $mod, RETURN, exec, $term
bind = $mod, Q, killactive
bind = $mod SHIFT, E, exit
bind = $mod, F, fullscreen
bind = $mod, V, togglefloating
bind = $mod, SPACE, exec, qs ipc call launcher toggle
bind = $mod, B, exec, firefox

bind = $mod, H, movefocus, l 
bind = $mod, L, movefocus, r 
bind = $mod, K, movefocus, u 
bind = $mod, J, movefocus, d 

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+ && qs ipc call osd brightness
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%- && qs ipc call osd brightness
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ && qs ipc call osd volume
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && qs ipc call osd volume
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && qs ipc call osd volume

exec-once = hypridle
exec-once = mako
exec-once = ~/dots/theme/wall.sh
bind = $mod, ESCAPE, exec, hyprlock

# screenshots: region to clipboard, full screen to ~/Pictures
bind = $mod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy && notify-send "Screenshot" "region copied"
bind = , PRINT, exec, mkdir -p ~/Pictures && grim ~/Pictures/$(date +%Y%m%d-%H%M%S).png && notify-send "Screenshot" "saved"

bind = $mod, E, exec, foot -e yazi
bind = $mod SHIFT, W, exec, foot -e bluetui
bind = $mod, D, exec, qs ipc call dashboard toggle

# Tauon lives on a special workspace (a scratchpad): it overlays whatever you
# are doing when you ask for it and vanishes again, without ever taking one of
# the nine numbered workspaces or moving you off the one you are on.
#
# Note the syntax: window rules in this build are a block with a nested match,
# not the `windowrule = float, class:^(x)$` line the wiki shows. The flat form
# parses as "invalid field" and the half-way form (match = class:...) parses
# cleanly and silently does nothing.
windowrule {
    name = tauon-home
    match {
        class = ^(tauonmb)$
    }
    workspace = special:music silent
    float = true
    size = 1100 720
}

bind = $mod, M, exec, qs ipc call music toggle        # search the library
bind = $mod SHIFT, M, exec, music window              # show/hide Tauon over your work
bind = $mod, N, exec, qs ipc call music next          # next shuffled track
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bind = $mod, T, exec, qs ipc call themes toggle
bind = $mod, P, exec, qs ipc call pomodoro toggle
bind = $mod SHIFT, T, exec, ~/dots/theme/wall.sh
bind = $mod, SLASH, exec, qs ipc call keybinds toggle   # Show keybindings
