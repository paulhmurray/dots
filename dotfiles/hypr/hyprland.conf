source = ~/.config/hypr/colours.conf
source = ~/.config/hypr/host.conf
source = ~/.config/hypr/hardware.conf


$mod = SUPER
$term = foot

exec-once = /usr/lib/polkit-kde-authentication-agent-1

input {
    kb_layout = us
    kb_options = ctrl:nocaps
    touchpad {
        natural_scroll = true
    }
}

general {
	gaps_in = 5
	gaps_out = 10
	border_size = 2
	layout = dwindle
    col.active_border = $accent
    col.inactive_border = $dim
}

decoration {
	rounding = 6
}
exec-once = quickshell
bind = $mod, R, exec, pkill quickshell; quickshell &          # Restart the bar
bind = $mod, RETURN, exec, $term                              # Terminal
bind = $mod, Q, killactive                                    # Close the focused window
bind = $mod SHIFT, E, exit                                    # Log out of Hyprland
bind = $mod, F, fullscreen                                    # Fullscreen the focused window
bind = $mod, V, togglefloating                                # Float or tile the focused window
bind = $mod, SPACE, exec, qs ipc call launcher toggle         # App launcher
bind = $mod, B, exec, firefox                                 # Firefox

bind = $mod, H, movefocus, l                                  # Focus the window to the left
bind = $mod, L, movefocus, r                                  # Focus the window to the right
bind = $mod, K, movefocus, u                                  # Focus the window above
bind = $mod, J, movefocus, d                                  # Focus the window below

bind = $mod, 1, workspace, 1                                  # Go to workspace 1
bind = $mod, 2, workspace, 2                                  # Go to workspace 2
bind = $mod, 3, workspace, 3                                  # Go to workspace 3
bind = $mod, 4, workspace, 4                                  # Go to workspace 4
bind = $mod, 5, workspace, 5                                  # Go to workspace 5
bind = $mod, 6, workspace, 6                                  # Go to workspace 6
bind = $mod, 7, workspace, 7                                  # Go to workspace 7
bind = $mod, 8, workspace, 8                                  # Go to workspace 8
bind = $mod, 9, workspace, 9                                  # Go to workspace 9
bind = $mod SHIFT, 1, movetoworkspace, 1                      # Send window to workspace 1
bind = $mod SHIFT, 2, movetoworkspace, 2                      # Send window to workspace 2
bind = $mod SHIFT, 3, movetoworkspace, 3                      # Send window to workspace 3
bind = $mod SHIFT, 4, movetoworkspace, 4                      # Send window to workspace 4
bind = $mod SHIFT, 5, movetoworkspace, 5                      # Send window to workspace 5
bind = $mod SHIFT, 6, movetoworkspace, 6                      # Send window to workspace 6
bind = $mod SHIFT, 7, movetoworkspace, 7                      # Send window to workspace 7
bind = $mod SHIFT, 8, movetoworkspace, 8                      # Send window to workspace 8
bind = $mod SHIFT, 9, movetoworkspace, 9                      # Send window to workspace 9

bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+ && qs ipc call osd brightness# Backlight, 5% steps
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%- && qs ipc call osd brightness# Backlight, 5% steps
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ && qs ipc call osd volume# Speaker volume, 5% steps
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && qs ipc call osd volume# Speaker volume, 5% steps
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && qs ipc call osd volume# Toggle speaker mute

exec-once = hypridle
exec-once = mako
exec-once = ~/dots/theme/wall.sh
bind = $mod, ESCAPE, exec, hyprlock                           # Lock the screen

# screenshots: region to clipboard, full screen to ~/Pictures
bind = $mod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy && notify-send "Screenshot" "region copied"# Screenshot a region to the clipboard
bind = , PRINT, exec, mkdir -p ~/Pictures && grim ~/Pictures/$(date +%Y%m%d-%H%M%S).png && notify-send "Screenshot" "saved"# Screenshot the screen to ~/Pictures

bind = $mod, E, exec, foot -e yazi                            # Files (yazi)
bind = $mod SHIFT, W, exec, foot -e bluetui                   # Bluetooth devices
bind = $mod, D, exec, qs ipc call dashboard toggle            # Dashboard — calendar, system, weather, dots

# Tauon lives on a special workspace (a scratchpad): it overlays whatever you
# are doing when you ask for it and vanishes again, without ever taking one of
# the nine numbered workspaces or moving you off the one you are on.
#
# Note the syntax: window rules in this build are a block with a nested match,
# not the `windowrule = float, class:^(x)$` line the wiki shows. The flat form
# parses as "invalid field" and the half-way form (match = class:...) parses
# cleanly and silently does nothing.
windowrule {
    name = tauon-home
    match {
        class = ^(tauonmb)$
    }
    workspace = special:music silent
    float = true
    size = 1100 720
}

bind = $mod, M, exec, qs ipc call music toggle        # Search and play from the music library
bind = $mod SHIFT, M, exec, music window              # Show or hide the music player
bind = $mod, N, exec, qs ipc call music next          # Skip to the next shuffled track
bindl = , XF86AudioPlay, exec, playerctl play-pause           # Play or pause whatever is playing
bindl = , XF86AudioNext, exec, playerctl next                 # Next track in the running player
bindl = , XF86AudioPrev, exec, playerctl previous             # Previous track in the running player
bind = $mod, T, exec, qs ipc call themes toggle               # Theme picker
bind = $mod, P, exec, qs ipc call pomodoro toggle             # Pomodoro timer
bind = $mod SHIFT, T, exec, ~/dots/theme/wall.sh              # New wallpaper
bind = $mod, SLASH, exec, qs ipc call keybinds toggle   # Show this list
