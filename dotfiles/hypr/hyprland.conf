source = ~/.config/hypr/colours.conf
source = ~/.config/hypr/host.conf


$mod = SUPER
$term = foot

exec-once = /usr/lib/polkit-kde-authentication-agent-1

input {
    kb_layout = us
    kb_options = ctrl:nocaps
    touchpad {
        natural_scroll = true
    }
}

general {
	gaps_in = 5
	gaps_out = 10
	border_size = 2
	layout = dwindle
    col.active_border = $accent
    col.inactive_border = $dim
}

decoration {
	rounding = 6
}
exec-once = quickshell
bind = $mod, R, exec, pkill quickshell; quickshell &
bind = $mod, RETURN, exec, $term
bind = $mod, Q, killactive
bind = $mod SHIFT, E, exit
bind = $mod, F, fullscreen
bind = $mod, V, togglefloating
bind = $mod, SPACE, exec, qs ipc call launcher toggle
bind = $mod, B, exec, firefox

bind = $mod, H, movefocus, l 
bind = $mod, L, movefocus, r 
bind = $mod, K, movefocus, u 
bind = $mod, J, movefocus, d 

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4

bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+ && qs ipc call osd brightness
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%- && qs ipc call osd brightness
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ && qs ipc call osd volume
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && qs ipc call osd volume
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && qs ipc call osd volume

exec-once = hypridle
exec-once = mako
exec-once = swaybg -c "#$bg_hex"
bind = $mod, ESCAPE, exec, hyprlock

# screenshots: region to clipboard, full screen to ~/Pictures
bind = $mod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy && notify-send "Screenshot" "region copied"
bind = , PRINT, exec, mkdir -p ~/Pictures && grim ~/Pictures/$(date +%Y%m%d-%H%M%S).png && notify-send "Screenshot" "saved"

bind = $mod, E, exec, foot -e yazi
bind = $mod SHIFT, W, exec, foot -e bluetui
bind = $mod, D, exec, qs ipc call dashboard toggle

bind = $mod, M, exec, tauon
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bind = $mod, T, exec, qs ipc call themes toggle
bind = $mod, P, exec, qs ipc call pomodoro toggle
